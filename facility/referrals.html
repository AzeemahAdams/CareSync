<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Referrals — CareSync Facility</title>
  <meta name="theme-color" content="#1E293B">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/variables.css"><link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/global.css"><link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/patient.css"><link rel="stylesheet" href="../css/facility.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body class="role-facility">
<div class="app-shell">
  <header class="app-topbar">
    <button class="sidebar-toggle" aria-label="Toggle sidebar"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
    <a class="topbar-logo" href="../index.html"><svg width="26" height="26" viewBox="0 0 28 28" aria-hidden="true"><rect width="28" height="28" rx="8" fill="#3B82F6"/><path d="M8 14h4l2-4 3 8 2-4h1" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>Care<span>Sync</span></a>
    <div class="topbar-spacer"></div>
    <div class="topbar-actions"><span class="topbar-name"></span><div class="topbar-avatar" aria-hidden="true">F</div></div>
  </header>
  <div class="sidebar-overlay"></div>
  <aside class="app-sidebar" aria-label="Facility navigation">
    <p class="sidebar-section-label">Facility</p>
    <ul class="sidebar-nav">
      <li class="sidebar-nav-item"><a href="dashboard.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg> Overview</a></li>
      <li class="sidebar-nav-item"><a href="profile.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg> Facility Profile</a></li>
      <li class="sidebar-nav-item"><a href="services.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="2"/><path d="m9 12 2 2 4-4"/></svg> Services</a></li>
      <li class="sidebar-nav-item"><a href="referrals.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m17 3 4 4-4 4M3 7h18M7 21l-4-4 4-4M21 17H3"/></svg> Referrals</a></li>
    </ul>
    <div class="sidebar-divider"></div>
    <ul class="sidebar-nav">
      <li class="sidebar-nav-item danger"><button data-action="logout"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg> Log out</button></li>
    </ul>
  </aside>

  <main class="app-main" id="main">
    <div class="page-header"><h1>Referral Management</h1><p>Review, accept or decline incoming referrals.</p></div>

    <div class="tabs" role="tablist">
      <button class="tab-btn" role="tab" aria-selected="true" data-filter="all">All</button>
      <button class="tab-btn" role="tab" aria-selected="false" data-filter="Pending">Pending</button>
      <button class="tab-btn" role="tab" aria-selected="false" data-filter="Accepted">Accepted</button>
      <button class="tab-btn" role="tab" aria-selected="false" data-filter="In progress">In Progress</button>
      <button class="tab-btn" role="tab" aria-selected="false" data-filter="Completed">Completed</button>
    </div>

    <div class="referral-list" id="fac-referrals-list"></div>
  </main>
</div>

<script src="../js/config/api-config.js"></script>
<script src="../js/config/translations.js"></script>
<script src="../js/components/icons.js"></script>
<script src="../js/components/toast.js"></script>
<script src="../js/components/modal.js"></script>
<script src="../js/components/form-validation.js"></script>
<script src="../js/services/api-service.js"></script>
<script src="../js/services/auth-service.js"></script>
<script src="../js/services/mock-data.js"></script>
<script src="../js/services/facility-service.js"></script>
<script src="../js/services/referral-service.js"></script>
<script src="../js/components/app-shell.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  if (!CareSync.auth.requireAuth(['facility'])) return;
  CareSync.appShell.init();

  let allRefs = [], activeFilter = 'all';

  const statusPill = s => {
    const m = {Pending:'status-pending',Accepted:'status-accepted','In progress':'status-in-progress',Completed:'status-completed',Declined:'status-declined'};
    return `<span class="status-pill ${m[s]||'status-pending'}">${s}</span>`;
  };

  function actionButtons(r) {
    if (r.status === 'Pending') return `
      <button class="btn btn-primary btn-sm" data-action-id="${r.id}" data-new-status="Accepted">Accept</button>
      <button class="btn btn-danger btn-sm" data-action-id="${r.id}" data-new-status="Declined">Decline</button>`;
    if (r.status === 'Accepted') return `
      <button class="btn btn-secondary btn-sm" data-action-id="${r.id}" data-new-status="In progress">Mark in progress</button>`;
    if (r.status === 'In progress') return `
      <button class="btn btn-primary btn-sm" data-action-id="${r.id}" data-new-status="Completed">Mark completed</button>`;
    return '';
  }

  function render() {
    const list    = document.getElementById('fac-referrals-list');
    const visible = activeFilter === 'all' ? allRefs : allRefs.filter(r => r.status === activeFilter);
    if (!visible.length) {
      list.innerHTML = `<div class="empty-state"><div class="empty-state-icon"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m17 3 4 4-4 4M3 7h18M7 21l-4-4 4-4M21 17H3"/></svg></div><h3>No referrals</h3><p>No ${activeFilter === 'all' ? '' : activeFilter.toLowerCase() + ' '}referrals found.</p></div>`;
      return;
    }
    list.innerHTML = visible.map(r => `
      <div class="referral-item" id="ref-item-${r.id}">
        <div class="referral-item-info">
          <div class="referral-item-id">${r.refNumber} · Patient: ${r.patientRef}</div>
          <div class="referral-item-facilities">${r.from} <span style="color:var(--color-text-muted)">→</span> ${r.to}</div>
          <div class="referral-item-meta">${r.service} · ${r.date}</div>
          <div style="margin-top:var(--space-2);font-size:var(--fs-sm);color:var(--color-text-secondary)">${r.notes}</div>
        </div>
        <div class="referral-item-actions" style="flex-direction:column;align-items:flex-end;gap:var(--space-2)">
          ${statusPill(r.status)}
          <div class="referral-action-row">${actionButtons(r)}</div>
        </div>
      </div>`).join('');

    list.querySelectorAll('[data-action-id]').forEach(btn => {
      btn.addEventListener('click', async () => {
        const id = btn.dataset.actionId, newStatus = btn.dataset.newStatus;
        btn.disabled = true;
        try {
          await CareSync.referralService.updateStatus(id, newStatus);
          const ref = allRefs.find(r => r.id === id);
          if (ref) ref.status = newStatus;
          render();
          CareSync.toast.show(`Referral ${id} marked as ${newStatus}.`, 'success');
        } catch { CareSync.toast.show('Update failed.', 'error'); btn.disabled = false; }
      });
    });
  }

  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.setAttribute('aria-selected','false'));
      btn.setAttribute('aria-selected','true');
      activeFilter = btn.dataset.filter;
      render();
    });
  });

  try {
    allRefs = await CareSync.referralService.getFacilityReferrals(CareSync.facilityService._myId());
    render();
  } catch { document.getElementById('fac-referrals-list').innerHTML = '<p class="text-secondary">Could not load referrals.</p>'; }
});
</script>
</body>
</html>
