  <aside class="app-sidebar" aria-label="Admin navigation">

      <li class="sidebar-nav-item"><a href="users.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg> Users</a></li>

  <main class="app-main" id="main">
    <div class="page-header"><h1>Referral Oversight</h1><p>Platform-wide referral records.</p></div>

    <div class="data-table-wrap">
      <table class="data-table" aria-label="Referrals table">
        <thead><tr><th>Ref Number</th><th>From</th><th>To</th><th>Service</th><th>Date</th><th>Status</th><th>Details</th></tr></thead>
        <tbody id="admin-refs-tbody"></tbody>
      </table>
    </div>
  </main>
</div>

<script src="../js/config/api-config.js"></script>
<script src="../js/config/translations.js"></script>
<script src="../js/components/icons.js"></script>
<script src="../js/components/toast.js"></script>
<script src="../js/components/modal.js"></script>
<script src="../js/components/form-validation.js"></script>
<script src="../js/services/api-service.js"></script>
<script src="../js/services/auth-service.js"></script>
<script src="../js/services/mock-data.js"></script>
<script src="../js/services/admin-service.js"></script>
<script src="../js/components/app-shell.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  if (!CareSync.auth.requireAuth(['admin'])) return;
  CareSync.appShell.init();

  const sc = { Pending:'badge-warning', Accepted:'badge-info', 'In progress':'badge-info', Completed:'badge-success', Declined:'badge-danger' };
  const tbody = document.getElementById('admin-refs-tbody');

  try {
    const refs = await CareSync.adminService.getReferrals();
    tbody.innerHTML = refs.map(r => `
      <tr>
        <td><strong>${r.refNumber}</strong></td>
        <td class="td-muted" style="max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${r.from}</td>
        <td class="td-muted" style="max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${r.to}</td>
        <td class="td-muted">${r.service}</td>
        <td class="td-muted">${r.date}</td>
        <td><span class="badge ${sc[r.status]||'badge-info'}">${r.status}</span></td>
        <td><button class="btn btn-secondary btn-sm" data-ref='${JSON.stringify(r)}'>View</button></td>
      </tr>`).join('');

    tbody.querySelectorAll('[data-ref]').forEach(btn => {
      btn.addEventListener('click', () => {
        const r = JSON.parse(btn.dataset.ref);
        CareSync.modal.open({
          title: r.refNumber,
          body: `<p><strong>From:</strong> ${r.from}</p><p style="margin-top:8px"><strong>To:</strong> ${r.to}</p><p style="margin-top:8px"><strong>Service:</strong> ${r.service}</p><p style="margin-top:8px"><strong>Date:</strong> ${r.date}</p><p style="margin-top:8px"><strong>Status:</strong> ${r.status}</p><p style="margin-top:8px"><strong>Notes:</strong> ${r.notes}</p>`,
          actions:[{label:'Close',variant:'secondary'}]
        });
      });
    });
  } catch { tbody.innerHTML = '<tr><td colspan="7" style="color:var(--color-danger);padding:1rem">Error loading referrals.</td></tr>'; }
});
</script>
</body>
</html>
