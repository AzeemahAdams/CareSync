<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profile — CareRoute</title>
  <meta name="theme-color" content="#1E293B">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/variables.css"><link rel="stylesheet" href="../css/reset.css"><link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/components.css"><link rel="stylesheet" href="../css/patient.css"><link rel="stylesheet" href="../css/auth.css"><link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
<div class="app-shell">
  <header class="app-topbar">
    <button class="sidebar-toggle" aria-label="Toggle sidebar"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
    <a class="topbar-logo" href="../index.html"><svg width="26" height="26" viewBox="0 0 28 28" aria-hidden="true"><rect width="28" height="28" rx="8" fill="#3B82F6"/><path d="M8 14h4l2-4 3 8 2-4h1" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>Care<span>Route</span></a>
    <div class="topbar-spacer"></div>
    <div class="topbar-actions"><span class="topbar-name"></span><div class="topbar-avatar" aria-hidden="true">A</div></div>
  </header>
  <div class="sidebar-overlay"></div>
  <aside class="app-sidebar" aria-label="Patient navigation">
    <p class="sidebar-section-label">Patient</p>
    <ul class="sidebar-nav">
      <li class="sidebar-nav-item"><a href="dashboard.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg> Overview</a></li>
      <li class="sidebar-nav-item"><a href="find-care.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg> Find Healthcare</a></li>
      <li class="sidebar-nav-item"><a href="smart-matching.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg> Smart Matching</a></li>
      <li class="sidebar-nav-item"><a href="emergency.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/></svg> Emergency</a></li>
      <li class="sidebar-nav-item"><a href="referrals.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m17 3 4 4-4 4M3 7h18M7 21l-4-4 4-4M21 17H3"/></svg> My Referrals</a></li>
    </ul>
    <div class="sidebar-divider"></div>
    <ul class="sidebar-nav">
      <li class="sidebar-nav-item"><a href="profile.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg> Profile</a></li>
      <li class="sidebar-nav-item danger"><button data-action="logout"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg> Log out</button></li>
    </ul>
  </aside>

  <main class="app-main" id="main">
    <div class="page-header"><h1>My Profile</h1><p>Manage your personal information and preferences.</p></div>

    <div class="section-card">
      <div class="profile-avatar-section">
        <div class="profile-avatar-large" id="profile-initials">A</div>
        <div>
          <h2 id="profile-display-name" style="font-size:var(--fs-h3)">Patient Name</h2>
          <p class="text-secondary" style="font-size:var(--fs-sm)">Patient account</p>
        </div>
      </div>
      <div class="section-card-body">
        <form id="profile-form" novalidate>
          <div class="profile-grid" style="margin-bottom:var(--space-5)">
            <div class="field"><label for="p-name">Full name</label><input class="input" id="p-name" name="name" data-label="Full name" required autocomplete="name"></div>
            <div class="field"><label for="p-email">Email address</label><input class="input" id="p-email" name="email" type="email" data-label="Email address" required autocomplete="email"></div>
            <div class="field"><label for="p-phone">Phone number</label><input class="input" id="p-phone" name="phone" type="tel" autocomplete="tel"></div>
            <div class="field"><label for="p-lang">Preferred language</label>
              <select class="select" id="p-lang" name="language">
                <option value="en">English</option>
                <option value="yo">Yorùbá</option>
              </select>
            </div>
          </div>
          <h3 style="font-size:var(--fs-base);margin-bottom:var(--space-3)">Accessibility preferences</h3>
          <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:var(--space-2);margin-bottom:var(--space-5)">
            <label class="checkbox-group"><input type="checkbox" name="acc" value="wheelchair"> Wheelchair access required</label>
            <label class="checkbox-group"><input type="checkbox" name="acc" value="lift"> Lift / elevator required</label>
            <label class="checkbox-group"><input type="checkbox" name="acc" value="screen-reader"> Screen reader user</label>
            <label class="checkbox-group"><input type="checkbox" name="acc" value="large-text"> Prefers large text</label>
          </div>
          <div style="display:flex;gap:var(--space-3);flex-wrap:wrap">
            <button type="submit" class="btn btn-primary">Save changes</button>
            <button type="button" class="btn btn-secondary" id="cancel-edit">Discard</button>
          </div>
          <p id="profile-status" class="form-status" aria-live="polite" style="margin-top:var(--space-3)"></p>
        </form>
      </div>
    </div>

    <div class="section-card" style="margin-top:var(--space-5)">
      <div class="section-card-header"><h2>Account actions</h2></div>
      <div class="section-card-body" style="display:flex;gap:var(--space-3);flex-wrap:wrap">
        <button class="btn btn-secondary" onclick="CareSync.modal.open({title:'Change password',body:'Password change will be available after backend integration. Please contact support@careroute.ng to reset your password.',actions:[{label:'OK',variant:'primary'}]})">Change password</button>
        <button class="btn btn-secondary" onclick="CareSync.modal.open({title:'Notification settings',body:'Notification preferences will be available after backend integration.',actions:[{label:'OK',variant:'primary'}]})">Notification settings</button>
        <button class="btn btn-danger" style="margin-left:auto" onclick="CareSync.modal.confirm('Delete account','Permanently deleting your account will remove all your data. This cannot be undone. Are you sure?',()=>CareSync.toast.show('Account deletion requires backend confirmation. Contact support@careroute.ng.','warning'),true)">Delete account</button>
      </div>
    </div>
  </main>
</div>

<script src="../js/config/api-config.js"></script>
<script src="../js/config/translations.js"></script>
<script src="../js/components/icons.js"></script>
<script src="../js/components/toast.js"></script>
<script src="../js/components/modal.js"></script>
<script src="../js/components/form-validation.js"></script>
<script src="../js/services/api-service.js"></script>
<script src="../js/services/auth-service.js"></script>
<script src="../js/services/mock-data.js"></script>
<script src="../js/components/app-shell.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  if (!CareSync.auth.requireAuth(['patient'])) return;
  CareSync.appShell.init();

  // Load the actual logged-in user's details from sessionStorage / mock users
  // so the profile shows the right person's data.
  function _getLoggedInUser() {
    const session = CareSync.auth.getSession();
    if (!session) return null;
    // Try to match against mock users by token prefix
    const tokenId = session.token.replace('session_', '').split('_')[0]; // 'u1', 'u2', etc.
    const stored  = sessionStorage.getItem('cr_users');
    const users   = stored ? JSON.parse(stored) : CareSync.mockData.USERS;
    return users.find(u => u.id === tokenId) || users.find(u => u.role === session.role) || users[0];
  }

  const user = _getLoggedInUser();
  const nameEl  = document.getElementById('p-name');
  const emailEl = document.getElementById('p-email');
  const phoneEl = document.getElementById('p-phone');

  if (user) {
    nameEl.value  = user.name  || '';
    emailEl.value = user.email || '';
    phoneEl.value = user.phone || '';
    document.getElementById('profile-display-name').textContent = user.name || 'Patient';
    document.getElementById('profile-initials').textContent = (user.name || 'P').charAt(0).toUpperCase();
  }

  // Also pre-fill from sessionStorage name if available
  const storedName = sessionStorage.getItem('cr_name');
  if (storedName && nameEl && !nameEl.value) {
    nameEl.value = storedName;
    document.getElementById('profile-display-name').textContent = storedName;
    document.getElementById('profile-initials').textContent = storedName.charAt(0).toUpperCase();
  }

  const origValues = { name: nameEl.value, email: emailEl.value, phone: phoneEl.value };

  document.getElementById('profile-form').addEventListener('submit', e => {
    e.preventDefault();
    if (!CareSync.forms.validate(e.target)) return;

    // Persist updated name to sessionStorage so topbar reflects it immediately
    try { sessionStorage.setItem('cr_name', nameEl.value.trim()); } catch {}

    const statusEl = document.getElementById('profile-status');
    statusEl.className = 'form-status is-success';
    statusEl.textContent = 'Profile updated successfully.';
    document.getElementById('profile-display-name').textContent = nameEl.value.trim();
    document.getElementById('profile-initials').textContent = nameEl.value.trim().charAt(0).toUpperCase();

    // Update in stored users array so it persists within session
    try {
      const stored = sessionStorage.getItem('cr_users');
      if (stored && user) {
        const users = JSON.parse(stored);
        const idx   = users.findIndex(u => u.id === user.id);
        if (idx > -1) {
          users[idx].name  = nameEl.value.trim();
          users[idx].email = emailEl.value.trim();
          users[idx].phone = phoneEl.value.trim();
          sessionStorage.setItem('cr_users', JSON.stringify(users));
        }
      }
    } catch {}

    CareSync.toast.show('Profile saved.', 'success');
    setTimeout(() => { statusEl.textContent = ''; statusEl.className = 'form-status'; }, 4000);
  });

  document.getElementById('cancel-edit').addEventListener('click', () => {
    nameEl.value  = origValues.name;
    emailEl.value = origValues.email;
    phoneEl.value = origValues.phone;
    CareSync.toast.show('Changes discarded.', 'info');
  });
});
</script>
</body>
</html>
