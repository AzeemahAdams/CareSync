<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/variables.css"><link rel="stylesheet" href="../css/reset.css"><link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/components.css"><link rel="stylesheet" href="../css/patient.css"><link rel="stylesheet" href="../css/facility.css"><link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

  <header class="app-topbar">
    <button class="sidebar-toggle" aria-label="Toggle sidebar"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
    <a class="topbar-logo" href="../index.html"><svg width="26" height="26" viewBox="0 0 28 28" aria-hidden="true"><rect width="28" height="28" rx="8" fill="#3B82F6"/><path d="M8 14h4l2-4 3 8 2-4h1" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>Care<span>Route</span></a>
    <div class="topbar-spacer"></div>
    <div class="topbar-actions"><span class="topbar-name"></span><div class="topbar-avatar" aria-hidden="true">A</div></div>
  </header>
  <div class="sidebar-overlay"></div>
  <aside class="app-sidebar" aria-label="Patient navigation">
    <p class="sidebar-section-label">Patient</p>
    <ul class="sidebar-nav">
      <li class="sidebar-nav-item"><a href="dashboard.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg> Overview</a></li>
      <li class="sidebar-nav-item"><a href="find-care.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg> Find Healthcare</a></li>
      <li class="sidebar-nav-item"><a href="smart-matching.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg> Smart Matching</a></li>
      <li class="sidebar-nav-item"><a href="emergency.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/></svg> Emergency</a></li>
      <li class="sidebar-nav-item"><a href="referrals.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m17 3 4 4-4 4M3 7h18M7 21l-4-4 4-4M21 17H3"/></svg> My Referrals</a></li>
    </ul>
    <div class="sidebar-divider"></div>
    <ul class="sidebar-nav">
      <li class="sidebar-nav-item"><a href="profile.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg> Profile</a></li>
      <li class="sidebar-nav-item danger"><button data-action="logout"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg> Log out</button></li>
    </ul>
  </aside>

  <main class="app-main" id="main">
    <div class="page-header"><h1>My Referrals</h1><p>Track your referrals from creation to completion.</p></div>

    <!-- Filter tabs -->
    <div class="tabs" role="tablist" aria-label="Filter referrals">
      <button class="tab-btn" role="tab" aria-selected="true" data-filter="all">All</button>
      <button class="tab-btn" role="tab" aria-selected="false" data-filter="Pending">Pending</button>
      <button class="tab-btn" role="tab" aria-selected="false" data-filter="Accepted">Accepted</button>
      <button class="tab-btn" role="tab" aria-selected="false" data-filter="In progress">In Progress</button>
      <button class="tab-btn" role="tab" aria-selected="false" data-filter="Completed">Completed</button>
      <button class="tab-btn" role="tab" aria-selected="false" data-filter="Declined">Declined</button>
    </div>

    <div class="referral-list" id="referrals-list"></div>
  </main>
</div>

<script src="../js/config/api-config.js"></script>
<script src="../js/config/translations.js"></script>
<script src="../js/components/icons.js"></script>
<script src="../js/components/toast.js"></script>
<script src="../js/components/modal.js"></script>
<script src="../js/components/form-validation.js"></script>
<script src="../js/services/api-service.js"></script>
<script src="../js/services/auth-service.js"></script>
<script src="../js/services/mock-data.js"></script>
<script src="../js/services/referral-service.js"></script>
<script src="../js/components/app-shell.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  if (!CareSync.auth.requireAuth(['patient'])) return;
  CareSync.appShell.init();

  let allRefs = [], activeFilter = 'all';

  const statusPill = s => {
    const map = {Pending:'status-pending',Accepted:'status-accepted','In progress':'status-in-progress',Completed:'status-completed',Declined:'status-declined'};
    return `<span class="status-pill ${map[s]||'status-pending'}">${s}</span>`;
  };

  function render() {
    const list    = document.getElementById('referrals-list');
    const visible = activeFilter === 'all' ? allRefs : allRefs.filter(r => r.status === activeFilter);
    if (!visible.length) {
      list.innerHTML = `<div class="empty-state"><div class="empty-state-icon"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m17 3 4 4-4 4M3 7h18M7 21l-4-4 4-4M21 17H3"/></svg></div><h3>No referrals</h3><p>You have no ${activeFilter==='all'?'':''}${activeFilter} referrals.</p></div>`;
      return;
    }
    list.innerHTML = visible.map(r => `
      <div class="referral-item">
        <div class="referral-item-info">
          <div class="referral-item-id">${r.refNumber} &nbsp;·&nbsp; Patient ref: ${r.patientRef}</div>
          <div class="referral-item-facilities">${r.from} <span style="color:var(--color-text-muted)">→</span> ${r.to}</div>
          <div class="referral-item-meta">${r.service} &nbsp;·&nbsp; ${r.date}</div>
          <div style="margin-top:var(--space-2);font-size:var(--fs-sm);color:var(--color-text-secondary)">${r.notes}</div>
        </div>
        <div class="referral-item-actions" style="flex-direction:column;align-items:flex-end;gap:var(--space-2)">
          ${statusPill(r.status)}
          <button class="btn btn-secondary btn-sm" data-id="${r.id}">View details</button>
        </div>
      </div>`).join('');

    list.querySelectorAll('[data-id]').forEach(btn => {
      btn.addEventListener('click', () => {
        const ref = allRefs.find(r => r.id === btn.dataset.id);
        if (!ref) return;
        CareSync.modal.open({
          title: ref.refNumber,
          body: `<p><strong>From:</strong> ${ref.from}</p><p style="margin-top:8px"><strong>To:</strong> ${ref.to}</p><p style="margin-top:8px"><strong>Service:</strong> ${ref.service}</p><p style="margin-top:8px"><strong>Date:</strong> ${ref.date}</p><p style="margin-top:8px"><strong>Status:</strong> ${ref.status}</p><p style="margin-top:8px"><strong>Notes:</strong> ${ref.notes}</p>`,
          actions: [{ label:'Close', variant:'secondary' }]
        });
      });
    });
  }

  // Tab switching
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.setAttribute('aria-selected','false'));
      btn.setAttribute('aria-selected','true');
      activeFilter = btn.dataset.filter;
      render();
    });
  });

  // Load
  try {
    allRefs = await CareSync.referralService.getMyReferrals();
    render();
  } catch { document.getElementById('referrals-list').innerHTML = '<p class="text-secondary">Could not load referrals.</p>'; }
});
</script>
</body>
</html>
