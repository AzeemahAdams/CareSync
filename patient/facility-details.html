<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Facility Details — CareRoute</title>
  <meta name="theme-color" content="#1E293B">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/variables.css"><link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/global.css"><link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/patient.css"><link rel="stylesheet" href="../css/responsive.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>
<body>
<div class="app-shell">
  <header class="app-topbar">
    <button class="sidebar-toggle" aria-label="Toggle sidebar"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
    <a class="topbar-logo" href="../index.html"><svg width="26" height="26" viewBox="0 0 28 28" aria-hidden="true"><rect width="28" height="28" rx="8" fill="#3B82F6"/><path d="M8 14h4l2-4 3 8 2-4h1" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>Care<span>Route</span></a>
    <div class="topbar-spacer"></div>
    <div class="topbar-actions"><span class="topbar-name"></span><div class="topbar-avatar" aria-hidden="true">A</div></div>
  </header>
  <div class="sidebar-overlay"></div>
  <aside class="app-sidebar" aria-label="Patient navigation">
    <p class="sidebar-section-label">Patient</p>
    <ul class="sidebar-nav">
      <li class="sidebar-nav-item"><a href="dashboard.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg> Overview</a></li>
      <li class="sidebar-nav-item"><a href="find-care.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg> Find Healthcare</a></li>
      <li class="sidebar-nav-item"><a href="smart-matching.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg> Smart Matching</a></li>
      <li class="sidebar-nav-item"><a href="emergency.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/></svg> Emergency</a></li>
      <li class="sidebar-nav-item"><a href="referrals.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m17 3 4 4-4 4M3 7h18M7 21l-4-4 4-4M21 17H3"/></svg> My Referrals</a></li>
    </ul>
    <div class="sidebar-divider"></div>
    <ul class="sidebar-nav">
      <li class="sidebar-nav-item"><a href="profile.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg> Profile</a></li>
      <li class="sidebar-nav-item danger"><button data-action="logout"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg> Log out</button></li>
    </ul>
  </aside>

  <main class="app-main" id="main">
    <div style="margin-bottom:var(--space-4)"><a href="find-care.html" class="btn btn-secondary btn-sm">← Back to search</a></div>
    <div id="facility-detail-content">
      <div class="skeleton" style="height:200px;margin-bottom:var(--space-4)"></div>
      <div class="skeleton" style="height:120px;margin-bottom:var(--space-4)"></div>
      <div class="skeleton" style="height:300px"></div>
    </div>
  </main>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="../js/config/api-config.js"></script>
<script src="../js/config/translations.js"></script>
<script src="../js/components/icons.js"></script>
<script src="../js/components/toast.js"></script>
<script src="../js/components/modal.js"></script>
<script src="../js/components/form-validation.js"></script>
<script src="../js/services/api-service.js"></script>
<script src="../js/services/auth-service.js"></script>
<script src="../js/services/mock-data.js"></script>
<script src="../js/services/facility-service.js"></script>
<script src="../js/components/app-shell.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  if (!CareSync.auth.requireAuth(['patient'])) return;
  CareSync.appShell.init();

  const id = new URLSearchParams(window.location.search).get('id');
  const container = document.getElementById('facility-detail-content');

  if (!id) { container.innerHTML = '<p class="text-secondary">No facility specified.</p>'; return; }

  try {
    const f = await CareSync.facilityService.getById(id);
    document.title = f.name + ' — CareRoute';
    const statusCls = f.status==='Verified'?'badge-success':f.status==='Pending'?'badge-warning':'badge-danger';

    container.innerHTML = `
      <div class="section-card" style="margin-bottom:var(--space-5)">
        <div class="section-card-body">
          <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:var(--space-4);flex-wrap:wrap;margin-bottom:var(--space-4)">
            <div>
              <h1 style="font-size:clamp(1.375rem,1.1rem+1.3vw,1.875rem);margin-bottom:var(--space-2)">${f.name}</h1>
              <p class="text-secondary">${f.type}</p>
            </div>
            <span class="badge ${statusCls}" style="font-size:var(--fs-sm);padding:6px 14px">${f.status}</span>
          </div>
          <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:var(--space-4)">
            <div><strong style="font-size:0.6875rem;text-transform:uppercase;letter-spacing:.06em;color:var(--color-text-muted)">Address</strong><p style="margin-top:4px">${f.address}</p></div>
            <div><strong style="font-size:0.6875rem;text-transform:uppercase;letter-spacing:.06em;color:var(--color-text-muted)">Phone</strong><p style="margin-top:4px"><a href="tel:${f.phone}" style="color:var(--color-primary)">${f.phone}</a></p></div>
            <div><strong style="font-size:0.6875rem;text-transform:uppercase;letter-spacing:.06em;color:var(--color-text-muted)">Email</strong><p style="margin-top:4px"><a href="mailto:${f.email}" style="color:var(--color-primary)">${f.email}</a></p></div>
            <div><strong style="font-size:0.6875rem;text-transform:uppercase;letter-spacing:.06em;color:var(--color-text-muted)">Hours</strong><p style="margin-top:4px">${f.hours}</p></div>
            <div><strong style="font-size:0.6875rem;text-transform:uppercase;letter-spacing:.06em;color:var(--color-text-muted)">Distance</strong><p style="margin-top:4px">${f.distance} km away</p></div>
            <div><strong style="font-size:0.6875rem;text-transform:uppercase;letter-spacing:.06em;color:var(--color-text-muted)">Last updated</strong><p style="margin-top:4px">${f.updatedAt}</p></div>
          </div>
        </div>
      </div>

      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:var(--space-5);margin-bottom:var(--space-5)">
        <div class="section-card">
          <div class="section-card-header"><h2>Services</h2></div>
          <div class="section-card-body">
            <div style="display:flex;flex-wrap:wrap;gap:var(--space-2)">${f.services.map(s=>`<span class="tag">${s}</span>`).join('')}</div>
          </div>
        </div>
        <div class="section-card">
          <div class="section-card-header"><h2>Accessibility</h2></div>
          <div class="section-card-body">
            ${f.accessibility.length ? `<ul style="display:grid;gap:var(--space-2)">${f.accessibility.map(a=>`<li style="display:flex;align-items:center;gap:8px;font-size:var(--fs-sm)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#16A34A" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>${a}</li>`).join('')}</ul>` : '<p class="text-secondary" style="font-size:var(--fs-sm)">No accessibility information recorded.</p>'}
          </div>
        </div>
      </div>

      <div class="section-card" style="margin-bottom:var(--space-5)">
        <div class="section-card-header"><h2>Location</h2></div>
        <div style="height:300px;border-radius:0 0 var(--radius-lg) var(--radius-lg);overflow:hidden" id="detail-map"></div>
      </div>

      <div class="section-card">
        <div class="section-card-header"><h2>Information status</h2></div>
        <div class="section-card-body">
          <p class="text-secondary" style="font-size:var(--fs-sm)">This facility's information is <strong>${f.status.toLowerCase()}</strong>. Last updated: ${f.updatedAt}.</p>
          ${f.status!=='Verified' ? `<div class="note" style="margin-top:var(--space-3)">Unverified or pending information has not been confirmed by CareRoute administrators. Contact the facility directly to confirm details.</div>` : ''}
          <div style="margin-top:var(--space-4)">
            <button class="btn btn-primary" onclick="CareSync.modal.open({title:'Request referral',body:'Referral requests are processed by your current healthcare provider. Please discuss this facility with your clinician. This demo does not create real referrals.',actions:[{label:'Understood',variant:'primary'}]})">Request referral</button>
          </div>
        </div>
      </div>`;

    // Mini map
    requestAnimationFrame(() => {
      const mapEl = document.getElementById('detail-map');
      if (!mapEl) return;
      const m = L.map(mapEl,{zoomControl:true,scrollWheelZoom:false}).setView([f.lat,f.lng],15);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'}).addTo(m);
      L.marker([f.lat,f.lng]).addTo(m).bindPopup(`<strong>${f.name}</strong>`).openPopup();
      mapEl.querySelectorAll('svg').forEach(s=>{s.style.maxWidth='none';s.style.maxHeight='none';});
      setTimeout(()=>m.invalidateSize(),300);
    });

  } catch(e) {
    container.innerHTML = `<div class="empty-state"><div class="empty-state-icon"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg></div><h3>Facility not found</h3><p>${e.message||'Could not load facility details.'}</p><a href="find-care.html" class="btn btn-primary">Back to search</a></div>`;
  }
});
</script>
</body>
</html>
