<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Find Healthcare — CareSync</title>
  <meta name="theme-color" content="#1E293B">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/patient.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>
<body>
<div class="app-shell">
  <header class="app-topbar">
    <button class="sidebar-toggle" aria-label="Toggle sidebar"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
    <a class="topbar-logo" href="../index.html"><svg width="26" height="26" viewBox="0 0 28 28" aria-hidden="true"><rect width="28" height="28" rx="8" fill="#3B82F6"/><path d="M8 14h4l2-4 3 8 2-4h1" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>Care<span>Sync</span></a>
    <div class="topbar-spacer"></div>
    <div class="topbar-actions"><span class="topbar-name"></span><div class="topbar-avatar" aria-hidden="true">A</div></div>
  </header>
  <div class="sidebar-overlay"></div>
  <aside class="app-sidebar" aria-label="Patient navigation">
    <p class="sidebar-section-label">Patient</p>
    <ul class="sidebar-nav">
      <li class="sidebar-nav-item"><a href="dashboard.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg> Overview</a></li>
      <li class="sidebar-nav-item"><a href="find-care.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg> Find Healthcare</a></li>
      <li class="sidebar-nav-item"><a href="smart-matching.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg> Smart Matching</a></li>
      <li class="sidebar-nav-item"><a href="emergency.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/></svg> Emergency</a></li>
      <li class="sidebar-nav-item"><a href="referrals.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m17 3 4 4-4 4M3 7h18M7 21l-4-4 4-4M21 17H3"/></svg> My Referrals</a></li>
    </ul>
    <div class="sidebar-divider"></div>
    <ul class="sidebar-nav">
      <li class="sidebar-nav-item"><a href="profile.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg> Profile</a></li>
      <li class="sidebar-nav-item danger"><button data-action="logout"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg> Log out</button></li>
    </ul>
  </aside>

  <main class="app-main" id="main">
    <div class="page-header-row page-header">
      <div><h1>Find Healthcare</h1><p>Search and filter facilities across Nigeria.</p></div>
      <div class="view-toggle" role="group" aria-label="View mode">
        <button class="view-toggle-btn active" id="btn-list" aria-label="List view" title="List view"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg></button>
        <button class="view-toggle-btn" id="btn-map" aria-label="Map view" title="Map view"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></svg></button>
      </div>
    </div>

    <!-- Search bar -->
    <div class="search-filter-bar">
      <div class="search-filter-row">
        <div class="search-input-wrap" style="flex:2">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <input class="input" id="search-q" type="search" placeholder="Facility name or location…" aria-label="Search facilities">
        </div>
        <div class="filter-group">
          <select class="select filter-select" id="filter-service" aria-label="Service">
            <option value="">Any service</option>
            <option>General consultation</option><option>Emergency care</option><option>Maternal health</option>
            <option>Paediatrics</option><option>Surgery</option><option>Dental care</option>
            <option>Eye care</option><option>Laboratory</option><option>Pharmacy</option>
            <option>Radiology</option><option>Immunisation</option>
          </select>
          <select class="select filter-select" id="filter-type" aria-label="Facility type">
            <option value="">Any type</option>
            <option>Teaching Hospital</option><option>General Hospital</option>
            <option>Private Hospital</option><option>Primary Health Centre</option>
            <option>Clinic</option><option>Pharmacy</option>
          </select>
          <select class="select filter-select" id="filter-sort" aria-label="Sort by">
            <option value="relevance">Sort: Relevance</option>
            <option value="distance">Sort: Distance</option>
            <option value="name">Sort: Name</option>
          </select>
          <button class="btn btn-primary" id="btn-search">Search</button>
          <button class="btn btn-secondary" id="btn-clear">Clear</button>
        </div>
      </div>
      <p id="results-summary" class="text-secondary" style="font-size:var(--fs-sm)"></p>
    </div>

    <!-- List view -->
    <div id="list-view">
      <div class="facility-grid" id="facility-results"></div>
      <div id="pagination-wrap"></div>
    </div>

    <!-- Map view -->
    <div id="map-view" style="display:none">
      <div class="map-container" id="find-care-map"></div>
    </div>

  </main>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="../js/config/api-config.js"></script>
<script src="../js/config/translations.js"></script>
<script src="../js/components/icons.js"></script>
<script src="../js/components/toast.js"></script>
<script src="../js/components/modal.js"></script>
<script src="../js/components/form-validation.js"></script>
<script src="../js/services/api-service.js"></script>
<script src="../js/services/auth-service.js"></script>
<script src="../js/services/mock-data.js"></script>
<script src="../js/services/facility-service.js"></script>
<script src="../js/components/app-shell.js"></script>
<script>
(function(){
  document.addEventListener('DOMContentLoaded', async () => {
    if (!CareSync.auth.requireAuth(['patient'])) return;
    CareSync.appShell.init();

    const PAGE_SIZE = 6;
    let allResults = [], currentPage = 1, mapInstance = null;

    const statusClass = s => s==='Verified'?'badge-success':s==='Pending'?'badge-warning':'badge-danger';

    function renderCard(f) {
      return `<div class="facility-card">
        <div class="facility-card-header">
          <div><div class="facility-card-name">${f.name}</div><div class="facility-card-type">${f.type}</div></div>
          <span class="badge ${statusClass(f.status)}">${f.status}</span>
        </div>
        <div class="facility-card-meta">
          <div class="facility-meta-row"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>${f.location}</div>
          <div class="facility-meta-row"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="5" y="2" width="14" height="20" rx="2"/><path d="M12 18h.01"/></svg>${f.phone}</div>
          <div class="facility-meta-row"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>${f.hours} &nbsp;·&nbsp; ${f.distance} km away</div>
        </div>
        <div class="facility-card-tags">${f.services.slice(0,4).map(s=>`<span class="tag">${s}</span>`).join('')}${f.services.length>4?`<span class="tag">+${f.services.length-4} more</span>`:''}</div>
        <div class="facility-card-footer">
          <span class="text-secondary" style="font-size:var(--fs-sm)">Updated ${f.updatedAt}</span>
          <a href="facility-details.html?id=${f.id}" class="btn btn-primary btn-sm">View details</a>
        </div>
      </div>`;
    }

    function renderList() {
      const container = document.getElementById('facility-results');
      const start = (currentPage-1)*PAGE_SIZE;
      const page  = allResults.slice(start, start+PAGE_SIZE);
      if (!page.length) {
        container.innerHTML = `<div class="empty-state" style="grid-column:1/-1">
          <div class="empty-state-icon"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg></div>
          <h3>No facilities found</h3><p>Try adjusting your search terms or filters.</p>
        </div>`;
        document.getElementById('pagination-wrap').innerHTML = '';
        return;
      }
      container.innerHTML = page.map(renderCard).join('');
      renderPagination();
    }

    function renderPagination() {
      const total = Math.ceil(allResults.length / PAGE_SIZE);
      if (total <= 1) { document.getElementById('pagination-wrap').innerHTML=''; return; }
      let btns = `<button class="pagination-btn" ${currentPage===1?'disabled':''} id="pg-prev" aria-label="Previous page">‹</button>`;
      for (let i=1;i<=total;i++) btns += `<button class="pagination-btn ${i===currentPage?'active':''}" data-page="${i}">${i}</button>`;
      btns += `<button class="pagination-btn" ${currentPage===total?'disabled':''} id="pg-next" aria-label="Next page">›</button>`;
      const wrap = document.getElementById('pagination-wrap');
      wrap.innerHTML = `<div class="pagination">${btns}</div>`;
      wrap.querySelectorAll('[data-page]').forEach(b => b.addEventListener('click',()=>{currentPage=parseInt(b.dataset.page);renderList();}));
      document.getElementById('pg-prev')?.addEventListener('click',()=>{if(currentPage>1){currentPage--;renderList();}});
      document.getElementById('pg-next')?.addEventListener('click',()=>{if(currentPage<total){currentPage++;renderList();}});
    }

    async function doSearch() {
      const container = document.getElementById('facility-results');
      container.innerHTML = '<div class="skeleton" style="height:180px;grid-column:1/-1"></div>';
      try {
        const { results, total } = await CareSync.facilityService.search({
          q: document.getElementById('search-q').value.trim(),
          service: document.getElementById('filter-service').value,
          type: document.getElementById('filter-type').value,
          sort: document.getElementById('filter-sort').value,
        });
        allResults = results;
        currentPage = 1;
        document.getElementById('results-summary').textContent = `${total} facilit${total===1?'y':'ies'} found`;
        renderList();
        if (mapInstance) updateMapMarkers(results);
      } catch { container.innerHTML = '<p class="text-secondary" style="grid-column:1/-1">Error loading facilities. Please try again.</p>'; }
    }

    // Map
    function initMap(facilities) {
      if (mapInstance) return;
      const el = document.getElementById('find-care-map');
      mapInstance = L.map(el, { scrollWheelZoom: false }).setView([6.5244, 3.3792], 11);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'}).addTo(mapInstance);
      updateMapMarkers(facilities);
      setTimeout(()=>mapInstance.invalidateSize(),300);
    }

    function updateMapMarkers(facilities) {
      if (!mapInstance) return;
      mapInstance.eachLayer(l=>{ if(l instanceof L.Marker) mapInstance.removeLayer(l); });
      const markers = facilities.map(f => {
        const icon = L.divIcon({className:'',html:`<div style="background:${f.status==='Verified'?'#16A34A':'#D97706'};width:14px;height:14px;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)"></div>`,iconSize:[14,14],iconAnchor:[7,7]});
        return L.marker([f.lat,f.lng],{icon}).addTo(mapInstance).bindPopup(`<strong>${f.name}</strong><br>${f.type}<br><a href="facility-details.html?id=${f.id}">View details →</a>`);
      });
      if (markers.length) mapInstance.fitBounds(L.featureGroup(markers).getBounds().pad(0.2));
    }

    // View toggle
    document.getElementById('btn-list').addEventListener('click', () => {
      document.getElementById('list-view').style.display='';
      document.getElementById('map-view').style.display='none';
      document.getElementById('btn-list').classList.add('active');
      document.getElementById('btn-map').classList.remove('active');
    });

    document.getElementById('btn-map').addEventListener('click', () => {
      document.getElementById('list-view').style.display='none';
      document.getElementById('map-view').style.display='';
      document.getElementById('btn-map').classList.add('active');
      document.getElementById('btn-list').classList.remove('active');
      initMap(allResults);
    });

    document.getElementById('btn-search').addEventListener('click', doSearch);
    document.getElementById('btn-clear').addEventListener('click', () => {
      document.getElementById('search-q').value='';
      document.getElementById('filter-service').value='';
      document.getElementById('filter-type').value='';
      document.getElementById('filter-sort').value='relevance';
      doSearch();
    });
    document.getElementById('search-q').addEventListener('keydown', e => { if(e.key==='Enter') doSearch(); });

    // Initial load — read URL params from landing page search
    const params = new URLSearchParams(window.location.search);
    if (params.get('location')) document.getElementById('search-q').value = params.get('location');
    if (params.get('service'))  document.getElementById('filter-service').value = params.get('service');
    if (params.get('type'))     document.getElementById('filter-type').value    = params.get('type');
    doSearch();
  });
}());
</script>
</body>
</html>
