<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found — CareRoute</title>
  <meta name="theme-color" content="#1E293B">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600&family=Manrope:wght@800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/variables.css">
  <style>
    *,*::before,*::after{box-sizing:border-box}
    body{font-family:var(--font-body,'DM Sans',sans-serif);background:var(--color-background,#F1F5F9);margin:0;min-height:100vh;display:grid;place-items:center;padding:var(--space-4,1rem)}
    .card{background:#fff;border-radius:16px;padding:clamp(2rem,6vw,3.5rem) clamp(1.5rem,5vw,3rem);max-width:480px;width:100%;text-align:center;box-shadow:0 4px 24px rgba(15,23,42,.08);border:1px solid var(--color-border,#E2E8F0)}
    .status{font-family:var(--font-heading,'Manrope',sans-serif);font-size:clamp(4rem,15vw,7rem);font-weight:800;color:var(--color-primary,#3B82F6);line-height:1;margin-bottom:.5rem}
    h1{font-family:var(--font-heading,'Manrope',sans-serif);font-size:clamp(1.25rem,3vw,1.75rem);color:var(--color-text,#0F172A);margin:0 0 .75rem}
    p{color:var(--color-text-secondary,#64748B);line-height:1.6;margin:0 0 2rem;max-width:36ch;margin-inline:auto}
    .actions{display:flex;gap:.75rem;justify-content:center;flex-wrap:wrap}
    .btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 1.5rem;border-radius:10px;font-weight:600;text-decoration:none;border:1px solid transparent;font-size:1rem;cursor:pointer}
    .btn-primary{background:var(--color-primary,#3B82F6);color:#fff}
    .btn-primary:hover{background:var(--color-primary-dark,#1D4ED8)}
    .btn-secondary{background:#fff;color:var(--color-text,#0F172A);border-color:var(--color-border,#E2E8F0)}
    .btn-secondary:hover{border-color:var(--color-primary,#3B82F6)}
    .logo{display:inline-flex;align-items:center;gap:.5rem;font-family:var(--font-heading,'Manrope',sans-serif);font-weight:800;font-size:1.25rem;text-decoration:none;color:var(--color-text,#0F172A);margin-bottom:2rem}
    .logo span{color:var(--color-primary,#3B82F6)}
  </style>
</head>
<body>
  <div class="card">
    <a class="logo" href="index.html">
      <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true">
        <rect width="28" height="28" rx="8" fill="#3B82F6"/>
        <path d="M8 14h4l2-4 3 8 2-4h1" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Care<span>Route</span>
    </a>

    <div class="status" aria-hidden="true">404</div>
    <h1>Page not found</h1>
    <p>The page you're looking for doesn't exist, may have moved, or you may have mistyped the address.</p>

    <div class="actions">
      <a class="btn btn-primary" href="index.html">Go home</a>
      <a class="btn btn-secondary" href="find-care.html">Find Healthcare</a>
    </div>
  </div>
</body>
</html>
